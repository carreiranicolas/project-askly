services:
  db:
    image: postgres:15
    container_name: askly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askly_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-askly_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - askly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askly} -d ${POSTGRES_DB:-askly_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: askly_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      POSTGRES_USER: ${POSTGRES_USER:-askly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askly_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-askly_db}
      # Dentro da rede do compose, a app fala com o serviço "db" na porta interna 5432.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FLASK_APP: app
      FLASK_DEBUG: 0
      # Em produção, aponte para um Redis: redis://redis:6379
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  askly_postgres_data:
    driver: local