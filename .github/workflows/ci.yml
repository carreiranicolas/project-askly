name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: askly
          POSTGRES_PASSWORD: askly_dev_password
          POSTGRES_DB: askly_test_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U askly -d askly_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://askly:askly_dev_password@localhost:5432/askly_test_db
      SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install ".[dev,test]"

      - name: Lint (advisory)
        continue-on-error: true
        run: |
          black --check .
          isort --check-only .
          flake8 .

      - name: Testes
        run: pytest
