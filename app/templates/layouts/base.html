<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme bootstrap: applied before first paint to avoid FOUC.
         Reads localStorage('askly-theme'); falls back to system. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("askly-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="description" content="Askly — Plataforma interna de suporte com gestão de chamados, RBAC e auditoria." />
    <title>{% block title %}Askly{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/check.svg') }}" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Legacy: Bulma (temporary — will be removed as pages are migrated) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />

    <!-- Design System (overrides Bulma where applicable) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% block body %}
      <div id="askly-page" class="askly-page">
        {% block content %}{% endblock %}
      </div>
    {% endblock %}

    <!-- Global theme toggle (floating). Hidden on pages that
         provide an inline sidebar toggle via .askly-has-sidebar-toggle. -->
    {% block theme_toggle %}
      <button
        type="button"
        class="askly-theme-toggle askly-theme-toggle--float"
        data-theme-toggle
        data-no-transition
        aria-label="Alternar tema"
        title="Alternar tema"
      >
        <svg class="askly-theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="askly-theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    {% endblock %}

    <script defer src="{{ url_for('static', filename='js/page-transition.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/theme.js') }}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
